[project]
name = "downlids"
version = "0.1.0"
description = "Aplicación web para obtener información y descargar recursos multimedia."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "aiofiles>=25.1.0",
    "curl-cffi>=0.16.3",
    "fastapi>=0.141.1",
    "imageio-ffmpeg>=0.6.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.0",
    "yt-dlp>=2026.7.4",
]
